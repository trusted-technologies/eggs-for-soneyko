name: Build Linux instance images
on:
  push:
    branches: [main]
    paths: ['images/**', '.github/workflows/images.yml']
  pull_request:
    paths: ['images/**', '.github/workflows/images.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: debian-13
            base: debian:trixie-slim
          - tag: ubuntu-24.04
            base: ubuntu:24.04
          - tag: alpine-3.22
            base: alpine:3.22
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and load test image
        uses: docker/build-push-action@v6
        with:
          context: images/instance
          build-args: BASE_IMAGE=${{ matrix.base }}
          tags: soneyko-instance:test
          load: true
      - name: Check unprivileged persistence across recreation
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/instance-volume"
          chmod 777 "$RUNNER_TEMP/instance-volume"
          run_guest() {
            docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
              --memory 512m --cpus 1 --pids-limit 128 \
              --tmpfs /tmp:rw,nosuid,size=64m \
              -v "$RUNNER_TEMP/instance-volume:/home/container" \
              soneyko-instance:test /bin/sh -lc "$1"
          }
          run_guest 'echo persisted > /root/soneyko-check; test "$(id -u)" = 0; cat /etc/os-release'
          run_guest 'test "$(cat /root/soneyko-check)" = persisted'
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: images/instance
          build-args: BASE_IMAGE=${{ matrix.base }}
          tags: ghcr.io/trusted-technologies/soneyko-instance:${{ matrix.tag }}
          push: true
          provenance: true
          sbom: true
